<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".55" stop-color="#0b1f3a"/><stop offset="1" stop-color="#0a3a6b"/></linearGradient>
 <radialGradient id="glow"><stop offset="0" stop-color="#2CB7F6" stop-opacity=".45"/><stop offset="1" stop-color="#2CB7F6" stop-opacity="0"/></radialGradient>
 <radialGradient id="glow2"><stop offset="0" stop-color="#F0B429" stop-opacity=".30"/><stop offset="1" stop-color="#F0B429" stop-opacity="0"/></radialGradient>
 <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9ED8FF"/></linearGradient>
 <linearGradient id="sig" gradientUnits="userSpaceOnUse" x1="92" y1="0" x2="196" y2="0"><stop offset="0" stop-color="#F0B429"/><stop offset="1" stop-color="#2CB7F6"/></linearGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity=".07"/></pattern>
 <clipPath id="card"><rect width="1000" height="280" rx="20"/></clipPath>
</defs>
<g clip-path="url(#card)">
 <rect width="1000" height="280" fill="url(#bg)"/>
 <rect width="1000" height="280" fill="url(#dots)"/>
 <circle cx="140" cy="60" r="220" fill="url(#glow)"><animateTransform attributeName="transform" type="translate" values="0 0;40 20;0 0" dur="9s" repeatCount="indefinite"/></circle>
 <circle cx="700" cy="150" r="190" fill="url(#glow2)"><animateTransform attributeName="transform" type="translate" values="0 0;-30 15;0 0" dur="7s" repeatCount="indefinite"/></circle>
 <path d="M0 238 C170 205 330 270 520 238 S860 205 1000 245 V280 H0Z" fill="#ffffff" opacity=".05">
  <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 238 C170 205 330 270 520 238 S860 205 1000 245 V280 H0Z;M0 245 C170 268 330 205 520 245 S860 268 1000 238 V280 H0Z;M0 238 C170 205 330 270 520 238 S860 205 1000 245 V280 H0Z"/>
 </path>

 <text x="56" y="72" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="14" fill="#58a6ff" letter-spacing=".5">// from registers to widgets</text>
 <text x="54" y="136" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" fill="url(#name)" letter-spacing="-1">Youssef Wheed</text>
 <text x="56" y="176" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="500" fill="#c9d1d9">Flutter Developer <tspan fill="#58a6ff">&amp;</tspan> Embedded Systems Engineer</text>
 <rect x="56" y="204" width="156" height="34" rx="17" fill="#238636"/>
 <circle cx="77" cy="221" r="5" fill="#fff"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
 <text x="92" y="226" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" textLength="104" lengthAdjust="spacingAndGlyphs">Open to Work</text>

 <!-- chip -> phone illustration -->
 <g transform="translate(640,0)">
  <g stroke="#F0B429" stroke-width="2.5" stroke-linecap="round">
   <path d="M20 120v-14M40 120v-14M60 120v-14M20 180v14M40 180v14M60 180v14M2 135h-14M2 150h-14M2 165h-14M78 135h14M78 150h14M78 165h14" opacity=".85"/>
  </g>
  <rect x="2" y="120" width="76" height="60" rx="8" fill="#161b22" stroke="#F0B429" stroke-width="2.5"/>
  <text x="40" y="156" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#F0B429">MCU</text>
  <text x="40" y="214" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="12" fill="#8b949e">C / ASM</text>

  <path id="wire" d="M92 150 H196" stroke="url(#sig)" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round" fill="none">
   <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <circle r="4.5" fill="#fff"><animateMotion dur="2.2s" repeatCount="indefinite" path="M92 150 H196"/></circle>

  <rect x="206" y="62" width="104" height="176" rx="18" fill="#161b22" stroke="#2CB7F6" stroke-width="2.5"/>
  <rect x="216" y="86" width="84" height="128" rx="8" fill="#0d1117"/>
  <rect x="226" y="98" width="64" height="12" rx="4" fill="#2CB7F6" opacity=".9"/>
  <rect x="226" y="120" width="64" height="26" rx="6" fill="#54C5F8" opacity=".25"/>
  <rect x="226" y="154" width="30" height="26" rx="6" fill="#F0B429" opacity=".35"/>
  <rect x="260" y="154" width="30" height="26" rx="6" fill="#3DDC84" opacity=".35"/>
  <rect x="226" y="188" width="64" height="10" rx="5" fill="#2CB7F6" opacity=".5">
   <animate attributeName="width" values="20;64;20" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="244" y="70" width="28" height="5" rx="2.5" fill="#30363d"/>
  <text x="258" y="262" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="12" fill="#8b949e">Flutter</text>
 </g>
</g>
<rect x=".5" y=".5" width="999" height="279" rx="20" fill="none" stroke="#30363d"/>
</svg>